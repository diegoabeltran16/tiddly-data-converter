[pytest]
# S0187 Unit E (F-06 / C-R handoff): a bare `pytest` invocation from repo
# root is not bounded by .gitignore, and can collect test modules nested
# under vendored or external material (.venv, data/refs/ in historical
# checkouts, node_modules). GIT_IGNORED != TOOL_EXECUTION_BOUNDARY.
testpaths = tests
# norecursedirs patterns match directory basenames (pytest semantics), so
# "data" covers data/refs, data/out, data/tmp etc. as defense-in-depth
# behind testpaths for any explicit non-default invocation.
norecursedirs = .git .venv node_modules data
